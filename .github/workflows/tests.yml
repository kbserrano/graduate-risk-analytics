name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # The raw survey export isn't in the repository, so the tests that
      # need it (tests/test_pipeline.py) skip; everything else runs on
      # synthetic data.
      - run: pytest -v
